name: Publicar demo

on:
  push:
    # `main` es la rama del proyecto; `master` está por si el repo se publica
    # con el nombre de rama antiguo.
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Empaquetar demo/
        uses: actions/upload-pages-artifact@v3
        with:
          path: demo

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
