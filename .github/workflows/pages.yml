name: Publicar demo

on:
  push:
    # `main` es la rama del proyecto; `master` está por si el repo se publica
    # con el nombre de rama antiguo.
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Preparar sitio (demo en raíz, directo en /live)
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/live
          cp -R demo/. _site/
          cp -R live/. _site/live/
          cp live.json _site/live.json
          test -f _site/index.html
          test -f _site/live/index.html
          test -f _site/live/viewer-fx.js
          test -f _site/live.json

      - name: Empaquetar sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
